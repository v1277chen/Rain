# ==============================================================================
# GitHub Actions 工作流程：HACS 整合架構檢驗與自動化測試
# 檔案路徑：.github/workflows/validate.yml
# 功能：驗證 HACS 儲存庫結構規範並執行 Python 單元測試
# ==============================================================================

name: HACS Validation & Unit Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 執行 Python 單元測試
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案原始碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: 執行獨立服務單元測試
        run: |
          python test_monitor.py

      - name: 執行 HACS 自訂整合單元測試
        run: |
          python tests/test_custom_component.py

  hacs:
    name: HACS 結構標準規範驗證
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案原始碼 (Checkout)
        uses: actions/checkout@v4

      - name: HACS 官方驗證工具 (HACS Action)
        uses: "hacs/action@main"
        with:
          category: "integration"
